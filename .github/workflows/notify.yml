name: Revalidate Documentation

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.mdx"
      - "**/*.md"
      - "**/meta.json"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger revalidation
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_SECRET }}" \
            "${{ secrets.REVALIDATE_URL }}/api/v1/revalidate"

      - name: Revalidation success
        if: success()
        run: |
          echo "✅ Documentation revalidated successfully"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Revalidation failed
        if: failure()
        run: |
          echo "❌ Failed to trigger documentation revalidation"
          echo "Please check:"
          echo "  - REVALIDATE_URL is set correctly"
          echo "  - REVALIDATE_SECRET is configured"
          echo "  - Your site is accessible"
          echo "  - The /api/v1/revalidate endpoint exists"
          exit 1
